[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "WM(RightBracket, LShift)" }]

[[behavior.macro.macros]]
operations = [{ operation = "tap", keycode = "WM(Enter, LShift)" }]

# Macro 45: clear every BLE profile (ZMK's BT_CLR_ALL), ending on profile 0.
[[behavior.macro.macros]]
operations = [
  { operation = "tap", keycode = "User3" },
  { operation = "tap", keycode = "User6" },
  { operation = "tap", keycode = "User2" },
  { operation = "tap", keycode = "User6" },
  { operation = "tap", keycode = "User1" },
  { operation = "tap", keycode = "User6" },
  { operation = "tap", keycode = "User0" },
  { operation = "tap", keycode = "User6" },
]

# BLE is the configured link. src/wired.rs adds the TRRS link, and the cable selects
# which one the right half uses.
[split]
connection = "ble"

[split.central]
rows = 5
cols = 7
row_offset = 0
col_offset = 0
ble_addr = [0x3c, 0x60, 0x1e, 0xa7, 0x5b, 0xd2]

[split.central.battery]
battery_adc_pin = "vddh"
# ZMK's battery range starts here, not at RMK's default of 3600.
battery_empty_mv = 3450

[split.central.matrix]
debouncer = "fast"
matrix_type = "normal"
row2col = true
row_pins = ["P1_01", "P1_03", "P1_05", "P1_07", "P1_06"]
col_pins = ["P0_24", "P0_20", "P0_17", "P0_15", "P0_16", "P0_13", "P0_14"]

[[split.peripheral]]
rows = 5
cols = 7
row_offset = 0
col_offset = 7
ble_addr = [0x81, 0xf4, 0x2a, 0x6e, 0x0d, 0xe9]

[split.peripheral.battery]
battery_adc_pin = "vddh"
# ZMK's battery range starts here, not at RMK's default of 3600.
battery_empty_mv = 3450

[split.peripheral.matrix]
debouncer = "fast"
matrix_type = "normal"
row2col = true
row_pins = ["P1_01", "P1_03", "P1_05", "P1_07", "P1_06"]
col_pins = ["P0_14", "P0_13", "P0_16", "P0_15", "P0_17", "P0_20", "P0_24"]
